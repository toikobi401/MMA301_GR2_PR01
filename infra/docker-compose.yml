# Local development stack. Run from the repo root: npm run docker:up
name: mma301-gr2-pr01

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    # A replica set is required for multi-document transactions, which the
    # wallet needs. One node is enough locally; it still provides the oplog
    # and session support a standalone server lacks.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      # Not mounted at /docker-entrypoint-initdb.d: the entrypoint runs those
      # before the replica set is initiated, and creating collections fails
      # at that point. The mongo-init service below applies it afterwards.
      - ./mongo/init:/init:ro
    healthcheck:
      # Reports healthy only once the replica set has a primary, so dependent
      # services do not start against a server that cannot accept writes.
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }" | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates collections, validators, and indexes once the replica set
  # has a primary. Safe to re-run — every step is idempotent.
  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./mongo/init:/init:ro
    command:
      - mongosh
      - "mongodb://mongo:27017/?replicaSet=rs0&directConnection=true"
      - --quiet
      - --file
      - /init/01-indexes.js

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/poker?replicaSet=rs0&directConnection=true}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me_at_least_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me_at_least_32_chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
    ports:
      - "${SERVER_PORT:-4000}:4000"
    volumes:
      # Bind-mount source for hot reload, but keep container node_modules.
      - ../apps/server/src:/repo/apps/server/src
      - ../packages:/repo/packages
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Database GUI at http://localhost:8081 — start with: --profile tools
  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      ME_CONFIG_BASICAUTH: "false"

  # Cloudflare Tunnel. Opt in with: --profile tunnel
  #
  # It dials out to Cloudflare, so the host needs no open inbound port and no
  # public IP. That is what makes this workable from a home machine.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      server:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  mongo-data:
  redis-data:
